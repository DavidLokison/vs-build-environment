name: 'Build and Attest Project'
description: 'Build mod project and upload an attestated zipfile'
inputs:
  modinfo:
    description: 'Modinfo JSON'
    required: true
  path:
    description: 'Path to modinfo.json'
    required: true
    default: 'modinfo.json'
# next steps:
#   - the release draft gets the artifact from the build, the metadata from the chained update and the commit hash from commit; all run together there
#   - figure out how to do the changelog
#   - after that, figure out how to automatically create the next SemVer version so that the workflow dispatch can run without any arguments
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Update Modinfo
      shell: bash
      run: |
        cat <<EOF | jq -c 'del(.["$schema"])' > ${{ inputs.path }}
        ${{ inputs.modinfo }}
        EOF
    - name: Fetch Build Properties
      shell: bash
      run: cp ${{ github.action_path }}/../Directory.Build.props .
    - name: Download Vintage Story
      shell: bash
      run: |
        curl -fSL "https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.0.tar.gz" -o "$RUNNER_TEMP/vintagestory.tar.gz"
        mkdir -p "$RUNNER_TEMP/vintagestory"
        tar -xzf "$RUNNER_TEMP/vintagestory.tar.gz" -C "$RUNNER_TEMP/vintagestory"
    - name: Build Project
      shell: bash
      run: dotnet publish -o dist -p:CI=true
    - name: (debug) List Files in Dist
      shell: bash
      run: ls dist
